<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consent flow states</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Familiar</p>
    <h1>Consent flow states</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="consent-title consent-desc">
        <title id="consent-title">Consent flow states</title>
        <desc id="consent-desc">ConsentFlow moves from idle through gathering, asking and listening to saving and done. Only the other person's spoken yes or their own tap leads to saving; a no ends in declined, and losing the face or cancelling ends in cancelled.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
<!-- arrows -->
<path d="M 100,224 V 152" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<path d="M 240,124 H 252 Q 260,124 260,132 V 224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 160,252 H 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 320,252 H 360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 480,252 H 520" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 640,252 H 680" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 800,252 H 840" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<path d="M 580,280 V 360" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<path d="M 260,280 V 360" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<path d="M 420,280 V 360" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<!-- labels -->
<rect x="101.0" y="182" width="62" height="12" rx="2" fill="#f5f5f5"/>
<text x="132" y="191" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ASK FIRST</text>
<rect x="594.0" y="314" width="20" height="12" rx="2" fill="#f5f5f5"/>
<text x="604" y="323" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
<rect x="274.0" y="314" width="32" height="12" rx="2" fill="#f5f5f5"/>
<text x="290" y="323" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOST</text>
<!-- nodes -->
<rect x="40" y="96" width="200" height="56" rx="6" fill="#f5f5f5"/>
<rect x="40" y="96" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="140.0" y="121.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">confirmingWithUser</text>
<text x="140.0" y="137.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">wearer agrees to ask</text>
<rect x="40" y="224" width="120" height="56" rx="6" fill="#f5f5f5"/>
<rect x="40" y="224" width="120" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="100.0" y="256.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">idle</text>
<rect x="200" y="224" width="120" height="56" rx="6" fill="#f5f5f5"/>
<rect x="200" y="224" width="120" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="260.0" y="249.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">gathering</text>
<text x="260.0" y="265.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4 embeds / s</text>
<rect x="360" y="224" width="120" height="56" rx="6" fill="#f5f5f5"/>
<rect x="360" y="224" width="120" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="420.0" y="249.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">asking</text>
<text x="420.0" y="265.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">names them</text>
<rect x="520" y="224" width="120" height="56" rx="6" fill="#f5f5f5"/>
<rect x="520" y="224" width="120" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="580.0" y="249.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">listening</text>
<text x="580.0" y="265.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">their yes or tap</text>
<rect x="680" y="224" width="120" height="56" rx="6" fill="#f5f5f5"/>
<rect x="680" y="224" width="120" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="740.0" y="249.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">saving</text>
<text x="740.0" y="265.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">store · contact</text>
<rect x="840" y="224" width="120" height="56" rx="6" fill="#f5f5f5"/>
<rect x="840" y="224" width="120" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="900.0" y="249.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">done</text>
<text x="900.0" y="265.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">label flips</text>
<rect x="200" y="360" width="280" height="56" rx="6" fill="#f5f5f5"/>
<rect x="200" y="360" width="280" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="340.0" y="385.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">cancelled</text>
<text x="340.0" y="401.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">they left · cancel · save failed</text>
<rect x="520" y="360" width="120" height="56" rx="6" fill="#f5f5f5"/>
<rect x="520" y="360" width="120" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="580.0" y="385.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">declined</text>
<text x="580.0" y="401.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nothing kept</text>
<text x="40" y="456" fill="#4f5d75" font-size="12" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">Only the other person moves listening forward. The LLM never decides consent.</text>
<line x1="40" y1="472" x2="960" y2="472" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="498" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="60" y="504" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Consent moment</text>
<rect x="158" y="498" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="178" y="504" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">State</text>
<rect x="231" y="498" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="251" y="504" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Terminal, nothing saved</text>
<line x1="394" y1="502" x2="422" y2="502" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="430" y="504" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Transition</text>
<line x1="508" y1="502" x2="536" y2="502" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="544" y="504" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Exit or optional</text>
      </svg>
    </div>
  </div>
</body>
</html>
