  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .frame { max-width: 1200px; width: 100%; }

    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }

        <title id="poyo-title">Poyo, one voice</title>
        <desc id="poyo-desc">Wake word or volume-button requests go to PoyoBrain or the CommandRouter; perception feeds people cues and the hazard registry. Every line goes through one VoiceSpeaker priority queue, which streams ElevenLabs speech with an Apple voice fallback and writes each turn into DialogueMemory, which Poyo reads as chat history.</desc>
